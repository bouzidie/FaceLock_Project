service:
  name: "FaceLockService"
  display_name: "FaceLock Biometric Service"
  description: "Service d'authentification biométrique par reconnaissance faciale"
  auto_start: 2

pipe:
  name: "\\\\.\\pipe\\FaceLockPipe"
  buffer_size: 65536
  timeout: 5000

auth:
  threshold: 0.40
  liveness_threshold: 0.60
  lock_timeout_seconds: 10

paths:
  project_root: ".."
  models_dir: "models"
  data_dir: "data"
  liveness_model: "shape_predictor_68_face_landmarks.dat"

logging:
  level: "INFO"
  file: "logs/facelock_service.log"
  max_bytes: 10485760
  backup_count: 5